[project]
name = "stage2-solver-sandbox-runner"
version = "0.1.0"
description = "Run Stage 2 solver.py problems concurrently in Alibaba Cloud Agent Sandboxes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2025.1.31",
    "e2b>=2.37.0,<3",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
solver-sandbox = "solver_runtime_sandbox.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solver_runtime_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["E501"]
